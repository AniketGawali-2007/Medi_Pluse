<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MediPulse Doctor Portal — Clinical dashboard for managing daily schedules, patient consultations, and health charts.">
  <title>Doctor Portal — MediPulse Healthcare</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar" aria-label="Doctor Sidebar Navigation">
      <div class="sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon">
            <i data-lucide="activity"></i>
          </div>
          <span>MediPulse</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#todayScheduleSection" class="nav-item active">
          <i data-lucide="clock"></i>
          <span>Today's Schedule</span>
        </a>
        <a href="#upcomingSection" class="nav-item">
          <i data-lucide="calendar"></i>
          <span>Upcoming Patients</span>
        </a>
        <a href="#patientSearchSection" class="nav-item">
          <i data-lucide="users"></i>
          <span>Patient Directory</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-badge">
          <div class="avatar" id="headerUserAvatar" style="background: linear-gradient(135deg, #0d9488, #0284c7);">PS</div>
          <div class="user-info">
            <span class="user-name" id="headerUserName">Dr. Priya Sharma</span>
            <span class="user-role" id="headerUserRole">Doctor</span>
          </div>
        </div>

        <button type="button" class="btn btn-danger btn-block btn-sm" onclick="logout()">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="top-header">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button type="button" class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle mobile menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="header-title">
            <h1>Clinical Doctor Portal</h1>
          </div>
        </div>

        <div class="header-actions">
          <span class="badge badge-verified">
            <i data-lucide="shield-check" style="width:12px; height:12px;"></i> Hospital Verified
          </span>
        </div>
      </header>

      <!-- Main Dashboard Content -->
      <main class="dashboard-content">
        
        <!-- Clinical Overview Statistics Widgets -->
        <section class="grid-3" style="margin-bottom: 1.5rem;" aria-label="Clinical Metrics Summary">
          <div class="stat-card">
            <div class="stat-icon blue">
              <i data-lucide="calendar-check"></i>
            </div>
            <div class="stat-info">
              <h3 id="todayCount">0</h3>
              <p>Today's Appointments</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon amber">
              <i data-lucide="alert-circle"></i>
            </div>
            <div class="stat-info">
              <h3 id="pendingCount">0</h3>
              <p>Pending Confirmations</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon teal">
              <i data-lucide="check-circle-2"></i>
            </div>
            <div class="stat-info">
              <h3 id="completedCount">0</h3>
              <p>Completed Consultations</p>
            </div>
          </div>
        </section>

        <!-- Today's Appointments Section -->
        <section id="todayScheduleSection" class="card" aria-label="Today's Schedule">
          <div class="card-header">
            <h2 class="card-title">
              <i data-lucide="clock"></i> Today's Patient Schedule
            </h2>
          </div>

          <div id="todayScheduleContainer"></div>
        </section>

        <!-- Upcoming Patients Queue -->
        <section id="upcomingSection" class="card" aria-label="Upcoming Patients">
          <div class="card-header">
            <h2 class="card-title">
              <i data-lucide="calendar"></i> Upcoming Patients
            </h2>
          </div>

          <div id="upcomingPatientsContainer"></div>
        </section>

        <!-- Patient Search & Directory Section -->
        <section id="patientSearchSection" class="card" aria-label="Patient Directory Search">
          <div class="card-header">
            <h2 class="card-title">
              <i data-lucide="users"></i> Clinical Patient Search
            </h2>
          </div>

          <div class="form-group search-box" style="margin-bottom: 1.5rem;">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="doctorPatientSearchInput" class="form-control" placeholder="Search patient database by name, patient ID, or clinical condition (e.g. 'Aarav', 'PAT-9082', 'Diabetes')...">
          </div>

          <div id="doctorPatientSearchResults"></div>
        </section>

      </main>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/doctor.js"></script>
</body>
</html>
